name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # Design-system analytics ratchet: fails when correct-use violations on
      # @unicron/ui components, or plain <button>s that bypass them (rawElements),
      # grow beyond .dsa/baseline.json.
      - run: pnpm ds:ratchet
      # Notes relay: two clients merge, refusals, persistence across restart.
      - run: pnpm --filter notes-relay test

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pim-core
      # Push relay: API, JMAP watching, Outlook webhook, signed APNs/FCM pushes.
      - run: cargo test -p mailbird-push-relay
      - run: cargo clippy -p mailbird-push-relay --all-targets -- -D warnings
      # App commands (shared by the desktop shell and the gateway) and the gateway's HTTP surface.
      - run: cargo test -p pim-app -p mailbird-gateway
      - run: cargo clippy -p pim-app -p mailbird-gateway --all-targets -- -D warnings

  # The self-hosted images build from a clean checkout (no push).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tools/push-relay/Dockerfile -t mailbird-push-relay .
      - run: docker build -f apps/gateway/Dockerfile -t mailbird-gateway .
      - name: Gateway image starts and serves the app
        run: |
          docker run -d --name gw -p 127.0.0.1:8080:8080 -e GATEWAY_PASSWORD=ci-password-0123456789 -e GATEWAY_KEY="$(openssl rand -base64 32)" mailbird-gateway
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/session && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker logs gw

  # Real IMAP (Dovecot) + SMTP (aiosmtpd) round trip: sync, flag push, archive
  # move, send, and the Sent copy. See tools/test-mail-servers/.
  mail-integration:
    # Ubuntu 24.04 ships Dovecot 2.3; 2.4 (ubuntu-latest from late 2026) rejects
    # the test config in tools/test-mail-servers/start.sh.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dovecot
        run: |
          sudo apt-get update
          sudo apt-get install -y dovecot-imapd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiosmtpd
      - name: Start test mail servers
        run: sudo env PYTHON="$(which python)" tools/test-mail-servers/start.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pim-core --test imap_smtp -- --ignored
        env:
          MAILBIRD_IT_SMTP_OUT: /tmp/mbtest/smtp-out
      - run: cargo test -p mailbird-push-relay --test imap -- --ignored
      - name: Server logs on failure
        if: failure()
        run: sudo tail -n 50 /tmp/mbtest/dovecot.log /tmp/mbtest/smtpd.log

  # Real JMAP + CalDAV/CardDAV server (Stalwart, AGPL, test-only): mail sync
  # and send, plus calendar and contact sync between two devices. The server
  # binary is cached between runs.
  jmap-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Stalwart binary
        uses: actions/cache@v4
        with:
          path: /tmp/mbjmap/bin
          key: stalwart-bin-${{ runner.os }}-${{ hashFiles('tools/test-mail-servers/start-jmap.sh') }}
      # Stalwart can't be built from source: its git dependency
      # stalwartlabs/opentelemetry-rust is gone. Use its prebuilt release,
      # the version start-jmap.sh was written for (0.16.26), else the newest 0.16.
      - name: Fetch Stalwart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list -R stalwartlabs/stalwart --limit 100 --json tagName -q '.[].tagName')
          tag=$(echo "$tags" | grep -x 'v0\.16\.26' || echo "$tags" | grep -m1 '^v0\.16\.')
          echo "Stalwart release: $tag"
          gh release view "$tag" -R stalwartlabs/stalwart --json assets -q '.assets[].name'
          mkdir -p /tmp/stalwart-dl /tmp/mbjmap/bin
          asset=stalwart-x86_64-unknown-linux-gnu.tar.gz
          gh release download "$tag" -R stalwartlabs/stalwart -D /tmp/stalwart-dl -p "$asset"
          tar -tzvf "/tmp/stalwart-dl/$asset"
          tar -xzf "/tmp/stalwart-dl/$asset" -C /tmp/stalwart-dl
          # The archive holds the server binary, named stalwart (else its one file).
          bin=$(find /tmp/stalwart-dl -type f -name stalwart | head -1)
          [ -n "$bin" ] || bin=$(find /tmp/stalwart-dl -type f ! -name '*.tar.gz' | head -1)
          test -n "$bin" || { echo "no stalwart binary in $asset"; exit 1; }
          install -m 0755 "$bin" /tmp/mbjmap/bin/stalwart
          /tmp/mbjmap/bin/stalwart --version || true
      - name: Start Stalwart
        run: tools/test-mail-servers/start-jmap.sh
        timeout-minutes: 45
      - run: cargo test -p pim-core --test jmap -- --ignored
      - run: cargo test -p pim-core --test dav -- --ignored
      - name: Server log on failure
        if: failure()
        run: tail -n 80 /tmp/mbjmap/stalwart.log

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and friends (Tauri Linux deps; dbus for the keychain)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The shell embeds the built front end, so tauri::generate_context! needs dist/.
      - run: mkdir -p apps/web/dist && touch apps/web/dist/index.html
      - run: cargo check -p mailbird-shell
