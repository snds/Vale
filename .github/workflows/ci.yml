name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # The build watch's rules and the build stamp (ADR-0091).
      - run: pnpm --filter web test
      # The build wrote its id into the page and into build.json, and they agree.
      - run: grep -q "<meta name=\"vale-build\" content=\"$(python3 -c 'import json; print(json.load(open("apps/web/dist/build.json"))["build"])')\"" apps/web/dist/index.html
      # Design-system analytics ratchet: fails when correct-use violations on
      # @unicron/ui components, or plain <button>s that bypass them (rawElements),
      # grow beyond .dsa/baseline.json.
      - run: pnpm ds:ratchet
      # Notes relay: two clients merge, refusals, persistence across restart.
      - run: pnpm --filter notes-relay test

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pim-core
      # Push relay: API, JMAP watching, Outlook webhook, signed APNs/FCM pushes.
      - run: cargo test -p vale-push-relay
      - run: cargo clippy -p vale-push-relay --all-targets -- -D warnings
      # App commands (shared by the desktop shell and the gateway) and the gateway's HTTP surface.
      - run: cargo test -p pim-app -p vale-gateway
      - run: cargo clippy -p pim-app -p vale-gateway --all-targets -- -D warnings
      # The gateway's shared-feed manifest (ADR-0090): the shape, and never backwards.
      - run: python3 tools/gateway-feed/test_manifest.py

  # The self-hosted images build from a clean checkout (no push).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tools/push-relay/Dockerfile -t vale-push-relay .
      - run: docker build -f apps/gateway/Dockerfile -t vale-gateway .
      - name: Gateway image starts and serves the app
        run: |
          docker run -d --name gw -p 127.0.0.1:8080:8080 -e GATEWAY_PASSWORD=ci-password-0123456789 -e GATEWAY_KEY="$(openssl rand -base64 32)" vale-gateway
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/session && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'
          # The web app's build id (ADR-0091): the page's tag and build.json agree, never cached.
          build=$(curl -fs http://127.0.0.1:8080/build.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')
          curl -fs http://127.0.0.1:8080/ | grep -q "<meta name=\"vale-build\" content=\"$build\""
          curl -fsI http://127.0.0.1:8080/build.json | grep -iq '^cache-control: no-cache'
          docker logs gw

  # Real IMAP (Dovecot) + SMTP (aiosmtpd) round trip: sync, flag push, archive
  # move, send, and the Sent copy. See tools/test-mail-servers/.
  mail-integration:
    # Ubuntu 24.04 ships Dovecot 2.3; 2.4 (ubuntu-latest from late 2026) rejects
    # the test config in tools/test-mail-servers/start.sh.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dovecot
        run: |
          sudo apt-get update
          sudo apt-get install -y dovecot-imapd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiosmtpd
      - name: Start test mail servers
        run: sudo env PYTHON="$(which python)" tools/test-mail-servers/start.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pim-core --test imap_smtp -- --ignored
        env:
          VALE_IT_SMTP_OUT: /tmp/mbtest/smtp-out
      - run: cargo test -p vale-push-relay --test imap -- --ignored
      - name: Server logs on failure
        if: failure()
        run: sudo tail -n 50 /tmp/mbtest/dovecot.log /tmp/mbtest/smtpd.log

  # Real JMAP + CalDAV/CardDAV server (Stalwart, AGPL, test-only): mail sync
  # and send, plus calendar and contact sync between two devices. The server
  # binary is cached between runs.
  jmap-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Stalwart binary
        uses: actions/cache@v4
        with:
          path: /tmp/mbjmap/bin
          key: stalwart-bin-${{ runner.os }}-${{ hashFiles('tools/test-mail-servers/start-jmap.sh') }}
      # Stalwart can't be built from source: its git dependency
      # stalwartlabs/opentelemetry-rust is gone. Use its prebuilt release,
      # the version start-jmap.sh was written for (0.16.26), else the newest 0.16.
      - name: Fetch Stalwart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list -R stalwartlabs/stalwart --limit 100 --json tagName -q '.[].tagName')
          tag=$(echo "$tags" | grep -x 'v0\.16\.26' || echo "$tags" | grep -m1 '^v0\.16\.')
          echo "Stalwart release: $tag"
          gh release view "$tag" -R stalwartlabs/stalwart --json assets -q '.assets[].name'
          mkdir -p /tmp/stalwart-dl /tmp/mbjmap/bin
          asset=stalwart-x86_64-unknown-linux-gnu.tar.gz
          gh release download "$tag" -R stalwartlabs/stalwart -D /tmp/stalwart-dl -p "$asset"
          tar -tzvf "/tmp/stalwart-dl/$asset"
          tar -xzf "/tmp/stalwart-dl/$asset" -C /tmp/stalwart-dl
          # The archive holds the server binary, named stalwart (else its one file).
          bin=$(find /tmp/stalwart-dl -type f -name stalwart | head -1)
          [ -n "$bin" ] || bin=$(find /tmp/stalwart-dl -type f ! -name '*.tar.gz' | head -1)
          test -n "$bin" || { echo "no stalwart binary in $asset"; exit 1; }
          install -m 0755 "$bin" /tmp/mbjmap/bin/stalwart
          /tmp/mbjmap/bin/stalwart --version || true
      - name: Start Stalwart
        run: tools/test-mail-servers/start-jmap.sh
        timeout-minutes: 45
      - run: cargo test -p pim-core --test jmap -- --ignored
      - run: cargo test -p pim-core --test dav -- --ignored
      - name: Server log on failure
        if: failure()
        run: tail -n 80 /tmp/mbjmap/stalwart.log

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and friends (Tauri Linux deps; dbus for the keychain)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The shell embeds the built front end, so tauri::generate_context! needs dist/.
      - run: mkdir -p apps/web/dist && touch apps/web/dist/index.html
      - run: cargo check -p vale-shell

  # Whether this run exercises the desktop release path. A push to main
  # always does. A pull request does only when it touches that path: the
  # Tauri folder, a lock file, or this workflow.
  release-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as its merge commit: HEAD^1 is the base.
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > changed.txt
            grep -Ex 'apps/web/src-tauri/.*|Cargo\.lock|pnpm-lock\.yaml|\.github/workflows/ci\.yml' changed.txt || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice::desktop release path runs: $run"

  # Publishes each push to main as the rolling `vale-main` pre-release on
  # snds/releases, signed with Vale's update key (ADR-0076), through the
  # update kit's reusable workflow (pinned; its README → Releasing). Without
  # the secrets it's a dry run that builds and says which secret is missing;
  # it never fails a push for one. A pull request that touches the release
  # path (see release-plan) runs it too, always as a dry run: the kit signs
  # with a throwaway key made in the job, reads no real key, publishes
  # nothing, and keeps the would-be `latest.json` as the `latest-json` artifact.
  release-main:
    if: needs.release-plan.outputs.run == 'true'
    needs: [web, shell, release-plan]
    permissions:
      contents: read
    uses: snds/app-updates/.github/workflows/release-main.yml@2a2a63f0f9a48c2e60e454307df237805fc14b20
    with:
      app: vale
      tauri-dir: apps/web/src-tauri
      platforms: '["macos-universal", "windows-x64"]'
      package-manager: pnpm
      kit-ref: 2a2a63f0f9a48c2e60e454307df237805fc14b20
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
