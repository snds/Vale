[package]
name = "vale-gateway"
version = "0.1.0"
description = "Self-hosted web gateway: the Vale web app with real accounts, on the same core as the desktop app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pim-core = { path = "../../crates/core" }
pim-app = { path = "../../crates/app" }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Sealing stored secrets (AES-256-GCM) and session tokens.
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
log = "0.4"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "stream"] }
