[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "apps/web/src-tauri", "apps/gateway", "tools/push-relay"]
# The shell needs platform WebView libraries; build the core alone with `cargo test -p pim-core`.
default-members = ["crates/core"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snds/Vale"
rust-version = "1.90"
