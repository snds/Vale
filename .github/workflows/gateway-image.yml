# The gateway's image on its main channel (ADR-0077, ADR-0090). Every push to main:
#
# 1. builds apps/gateway/Dockerfile with the version stamped,
#    `<apps/gateway/Cargo.toml version>-main.<commit time, UTC, YYYYMMDDHHMMSS>`,
#    and checks the container starts and reports that version;
# 2. pushes ghcr.io/snds/vale-gateway:<version>, then moves :main to the
#    same digest, and attests its build provenance to the registry;
# 3. only then writes `latest.json` ({"version", "image", "digest", "commit"})
#    to the rolling `gateway-main` pre-release of this repository. A running
#    gateway reads that file (apps/gateway/src/updates.rs), so it can only
#    ever offer an image that's already in the registry. This is the bridge:
#    gateways built before ADR-0090 read only this file;
# 4. then writes the same build, in the shared server shape ({"app",
#    "version", "commit", "pubDate", "images"}), to `latest.json` on the
#    rolling `vale-gateway-main` pre-release of snds/releases, where every
#    app's feed lives (tools/gateway-feed/manifest.py). A gateway reads both
#    files and offers the newer of the two.
#
# Steps 1 to 3 need no secret: GITHUB_TOKEN with `packages: write` and
# `contents: write`. Step 4 writes to another repository, so it needs the
# secret RELEASES_TOKEN (a fine-grained token: snds/releases only, Contents
# read and write). Without it step 4 is skipped with a notice and the run
# still passes: the bridge alone keeps every gateway updating.
#
# A run for an older commit (a re-run) pushes its version tag but never moves
# :main or either manifest backwards. Pull requests don't run it; CI's `images`
# job checks the image builds, and `core` runs the manifest script's tests.
name: Gateway image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gateway-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: meta
        run: |
          set -euo pipefail
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/gateway/Cargo.toml | head -1)
          stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
          version="$base-main.$stamp"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-main\.[0-9]{14}$' || { echo "::error::bad version $version"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vale-gateway"
          {
            echo "version=$version"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::building $image:$version"
      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker build -f apps/gateway/Dockerfile --build-arg "VALE_GATEWAY_VERSION=$VERSION" -t "$IMAGE:$VERSION" .
      - name: The image starts, serves the app and reports its version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          docker run -d --name gw -p 127.0.0.1:8080:8080 -e GATEWAY_PASSWORD=ci-password-0123456789 -e GATEWAY_KEY="$(openssl rand -base64 32)" "$IMAGE:$VERSION"
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/session && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'
          # The web app's build id (ADR-0091): the page's tag and build.json agree, never cached.
          build=$(curl -fs http://127.0.0.1:8080/build.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')
          curl -fs http://127.0.0.1:8080/ | grep -q "<meta name=\"vale-build\" content=\"$build\""
          curl -fsI http://127.0.0.1:8080/build.json | grep -iq '^cache-control: no-cache'
          docker logs gw 2>&1 | tee gw.log
          grep -q "gateway $VERSION on " gw.log
          [ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:$VERSION")" = "$VERSION" ]
          docker rm -f gw
      - name: Push the version tag
        id: push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE:$VERSION")
          digest=${digest#*@}
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest for $IMAGE:$VERSION"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::pushed $IMAGE:$VERSION ($digest)"
      - name: Build provenance for the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Is this the newest build?
        id: newest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=""
          if gh release download gateway-main -p latest.json -O current.json 2>/dev/null; then
            published=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' current.json)
          fi
          # Every version here is `x.y.z-main.<14 digits>`, which sort -V orders as semver does.
          newest=$(printf '%s\n%s\n' "$published" "$VERSION" | sed '/^$/d' | sort -V | tail -1)
          # The shared feed has its own never-backwards check; it is only tried for a build
          # that is the bridge's newest (this run's, or a re-run of it).
          if [ "$newest" = "$VERSION" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$newest" = "$VERSION" ] && [ "$published" != "$VERSION" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "::notice::published $published is not older than $VERSION: :main and the manifest stay"
          fi
      - name: Move :main to the same digest
        if: steps.newest.outputs.move == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$VERSION" "$IMAGE:main"
          docker push "$IMAGE:main"
          moved=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE:main")
          [ "${moved#*@}" = "$DIGEST" ] || { echo "::error::$IMAGE:main isn't $DIGEST"; exit 1; }
      - name: Announce it in gateway-main's latest.json
        if: steps.newest.outputs.move == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          manifest = {
              "version": os.environ["VERSION"],
              "image": os.environ["IMAGE"],
              "digest": os.environ["DIGEST"],
              "commit": os.environ["GITHUB_SHA"],
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          cat latest.json
          cat > notes.md <<NOTES
          The Vale web gateway's newest image (ADR-0077): \`$IMAGE:$VERSION\`, also tagged \`main\` (\`$DIGEST\`).

          To update a compose setup, run this beside its \`compose.yaml\`:

          \`\`\`sh
          docker compose pull && docker compose up -d
          \`\`\`

          A running gateway reads \`latest.json\` here and says in Settings → Gateway updates when a newer image is out. Built from $GITHUB_SHA.
          NOTES
          if gh release view gateway-main > /dev/null 2>&1; then
            gh release upload gateway-main latest.json --clobber
            gh release edit gateway-main --notes-file notes.md --title "Vale gateway $VERSION"
          else
            gh release create gateway-main latest.json --prerelease --target "$GITHUB_SHA" \
              --title "Vale gateway $VERSION" --notes-file notes.md
          fi
          echo "::notice::gateway-main now names $VERSION"
      # The shared feed (ADR-0090): the same build on snds/releases, in the server shape. Last,
      # so it too never names an image that isn't in the registry or a build :main isn't at.
      - name: Announce it in vale-gateway-main on snds/releases
        if: steps.newest.outputs.current == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          FEED_REPO: snds/releases
          FEED_TAG: vale-gateway-main
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Shared feed skipped::the secret RELEASES_TOKEN isn't set, so $FEED_TAG on $FEED_REPO wasn't written. gateway-main on this repository was, and gateways read both."
            echo "The shared feed \`$FEED_TAG\` on $FEED_REPO was **not** written: the secret \`RELEASES_TOKEN\` isn't set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A release needs a commit to tag, and the token must reach the repository.
          gh api "repos/$FEED_REPO/commits?per_page=1" > /dev/null 2>&1 || {
            echo "::error::RELEASES_TOKEN can't read $FEED_REPO (expired, or not scoped to it), or the repository has no commits."
            exit 1
          }
          mkdir -p feed
          previous=()
          exists=false
          if gh release view "$FEED_TAG" --repo "$FEED_REPO" > /dev/null 2>&1; then
            exists=true
            # A manifest that is there must be read: never write over one that couldn't be compared.
            if gh release view "$FEED_TAG" --repo "$FEED_REPO" --json assets -q '.assets[].name' | grep -qx latest.json; then
              gh release download "$FEED_TAG" --repo "$FEED_REPO" -p latest.json -O feed/published.json
              previous=(--previous feed/published.json)
            fi
          fi
          code=0
          python3 tools/gateway-feed/manifest.py --version "$VERSION" --commit "$GITHUB_SHA" \
            --image "$IMAGE@$DIGEST" "${previous[@]}" --out feed/latest.json || code=$?
          case "$code" in
            0) ;;
            3|4) echo "::notice::$FEED_TAG on $FEED_REPO already names this build or a newer one: it stays"; exit 0 ;;
            *) echo "::error::the feed's manifest couldn't be written"; exit 1 ;;
          esac
          cat feed/latest.json
          title="Vale gateway main ($VERSION)"
          notes="The newest image of the Vale web gateway: $IMAGE:$VERSION ($DIGEST), built from $GITHUB_REPOSITORY@$GITHUB_SHA. A running gateway reads latest.json here and says in Settings when a newer image is out. Not a release."
          if [ "$exists" = true ]; then
            gh release edit "$FEED_TAG" --repo "$FEED_REPO" --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create "$FEED_TAG" --repo "$FEED_REPO" --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          gh release upload "$FEED_TAG" --repo "$FEED_REPO" --clobber feed/latest.json
          echo "::notice::$FEED_TAG on $FEED_REPO now names $VERSION"
          echo "Published $VERSION to [\`$FEED_TAG\`](https://github.com/$FEED_REPO/releases/tag/$FEED_TAG)." >> "$GITHUB_STEP_SUMMARY"
