[package]
name = "vale-push-relay"
version = "0.1.0"
description = "Self-hosted push relay: watches mailboxes and wakes phones with content-free pushes"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pim-core = { path = "../../crates/core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Sealing stored secrets (AES-256-GCM) and signing APNs (ES256) and FCM (RS256) tokens.
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
futures = "0.3"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
